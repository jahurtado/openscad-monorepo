[project]
name = "openscad-monorepo-template-docs"
version = "0"
description = "MkDocs Material site for the OpenSCAD monorepo template. Separate uv project from the modeling tools (root pyproject): the site needs no OpenSCAD/trimesh."
requires-python = ">=3.10"
dependencies = [
    "mkdocs-material>=9.5",
]

# Site-builder env, not a distributable package: uv installs the dependencies
# into .venv but does not build/install this project itself.
[tool.uv]
package = false
